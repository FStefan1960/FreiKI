<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Prompts verwalten</title>
  <link rel="icon" type="image/png" href="/app-icon-192.png">
  <style>
    @font-face {
      font-family: 'Hanken Grotesk';
      font-style: normal;
      font-weight: 400 800;
      font-display: swap;
      src: url('/fonts/hanken-grotesk-latin-ext.woff2') format('woff2');
      unicode-range: U+0100-02BA, U+02BD-02C5, U+02C7-02CC, U+02CE-02D7, U+02DD-02FF, U+0304, U+0308, U+0329, U+1D00-1DBF, U+1E00-1E9F, U+1EF2-1EFF, U+2020, U+20A0-20AB, U+20AD-20C0, U+2113, U+2C60-2C7F, U+A720-A7FF;
    }
    @font-face {
      font-family: 'Hanken Grotesk';
      font-style: normal;
      font-weight: 400 800;
      font-display: swap;
      src: url('/fonts/hanken-grotesk-latin.woff2') format('woff2');
      unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD;
    }
    *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
    body{font-family:'Hanken Grotesk',sans-serif;background:#f1f5f9;min-height:100vh;color:#1f2937}
    .page{max-width:1200px;margin:0 auto;padding:24px;display:grid;grid-template-columns:280px 1fr;gap:20px;align-items:start}
    @media(max-width:820px){.page{grid-template-columns:1fr}}
    .card{background:#fff;border-radius:16px;box-shadow:0 4px 24px rgba(30,58,138,.10);padding:22px 26px}
    .header{display:flex;align-items:center;gap:14px;margin-bottom:4px}
    .header img{width:40px;height:40px;border-radius:9px}
    .header h1{font-size:19px;font-weight:700;color:#1E3A8A}
    .header p{font-size:12px;color:#6b7280}
    .full-span{grid-column:1/-1}
    h2{font-size:14px;font-weight:700;color:#1E3A8A;margin-bottom:10px}
    .u-filter{width:100%;padding:9px 11px;border:1px solid #d1d5db;border-radius:8px;font:inherit;font-size:13px;outline:none;margin-bottom:10px}
    .u-filter:focus{border-color:#2B9CD8}
    .list{display:flex;flex-direction:column;gap:2px;max-height:70vh;overflow-y:auto}
    .list-item{display:flex;align-items:center;gap:8px;padding:9px 10px;border-radius:8px;cursor:pointer;font-size:13px;color:#374151;border:1px solid transparent}
    .list-item:hover{background:#f0f9ff}
    .list-item.active{background:#eef2ff;border-color:#c7d2fe;color:#1E3A8A;font-weight:600}
    .list-item .icon{width:20px;text-align:center;flex-shrink:0}
    .list-item .title{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
    .list-item .hidden-tag{margin-left:auto;font-size:10px;color:#9ca3af;flex-shrink:0}
    .list-item.base{border-bottom:1px solid #e5e7eb;margin-bottom:6px;padding-bottom:11px}
    label{display:block;font-size:12px;font-weight:600;color:#374151;margin-bottom:5px}
    .hint-txt{font-weight:400;color:#9ca3af;font-size:11px}
    input[type=text],input[type=number],textarea{width:100%;padding:9px 11px;border:1px solid #d1d5db;border-radius:8px;font:inherit;font-size:13px;outline:none;background:#fff}
    input:focus,textarea:focus{border-color:#2B9CD8}
    textarea{resize:vertical;font-family:inherit}
    textarea.mono{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:12.5px;line-height:1.5}
    .field{margin-bottom:16px}
    .field-row{display:grid;grid-template-columns:70px 1fr 90px;gap:12px}
    @media(max-width:600px){.field-row{grid-template-columns:1fr}}
    .flags{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:8px;margin-bottom:16px}
    .flag{display:flex;align-items:center;gap:7px;font-size:13px;color:#374151;background:#f8fafc;border:1px solid #e5e7eb;border-radius:8px;padding:7px 10px}
    .flag input{width:auto}
    .btn{padding:9px 18px;border:none;border-radius:8px;font:inherit;font-size:13px;font-weight:600;cursor:pointer}
    .btn-primary{background:linear-gradient(135deg,#1E3A8A,#2B9CD8);color:#fff}
    .btn-primary:hover{opacity:.9}
    .btn:disabled{opacity:.5;cursor:default}
    .status-msg{font-size:13px;margin-left:10px}
    .status-msg.ok{color:#047857}
    .status-msg.err{color:#b91c1c}
    .empty{color:#9ca3af;font-size:13px;padding:20px 0;text-align:center}
    .back-link{display:inline-block;margin-top:16px;color:#6b7280;font-size:13px;text-decoration:none;cursor:pointer}
    .back-link:hover{color:#1E3A8A}
    .save-bar{display:flex;align-items:center;justify-content:flex-end;margin-top:6px}
    .note{font-size:11.5px;color:#9ca3af;margin-top:4px}
  </style>
</head>
<body>
<script>if (window.self !== window.top) document.documentElement.classList.add('embedded');</script>
<div class="page">
  <div class="card full-span">
    <div class="header">
      <img src="/app-icon-192.png" alt="">
      <div>
        <h1>Prompts verwalten</h1>
        <p>Werkzeug-Texte &amp; System-Prompts bearbeiten · nur für Administratoren · Änderungen wirken sofort, ohne Neustart</p>
      </div>
    </div>
  </div>

  <div class="card">
    <h2>Werkzeuge</h2>
    <input type="text" id="filter" class="u-filter" placeholder="Suchen …">
    <div class="list" id="list"><p class="empty">Lade …</p></div>
  </div>

  <div class="card" id="editor-card">
    <p class="empty">Werkzeug links auswählen.</p>
  </div>

  <a class="back-link full-span" onclick="if(window.parent && window.parent.closeToolPanel){window.parent.closeToolPanel();}else{window.top.location.href='/';}">← Zurück zum Chat</a>
</div>

<script>
function bail(){ (window.top||window).location.href='/'; }
async function ensureAdmin() {
  try {
    const r = await fetch('/api/me', { cache: 'no-store' });
    if (!r.ok) throw 0;
    const me = await r.json();
    if (me.role !== 'admin') throw 0;
    return true;
  } catch { bail(); return false; }
}
const H = { 'Content-Type': 'application/json' };
let PROMPTS = [];
let HAS_BASE = false;
let currentKey = null;

function renderList(filterTxt) {
  const f = (filterTxt || '').trim().toLowerCase();
  const wrap = document.getElementById('list');
  let html = '';
  if (HAS_BASE && (!f || 'basis-prompt'.includes(f))) {
    html += `<div class="list-item base${currentKey === '_base' ? ' active' : ''}" data-key="_base"><span class="icon">⚙️</span><span class="title">Basis-Prompt (für alle Werkzeuge)</span></div>`;
  }
  const rows = PROMPTS.filter(p => !f || p.title.toLowerCase().includes(f) || p.key.toLowerCase().includes(f));
  if (!rows.length && !HAS_BASE) { wrap.innerHTML = '<p class="empty">Keine Treffer.</p>'; return; }
  html += rows.map(p =>
    `<div class="list-item${currentKey === p.key ? ' active' : ''}" data-key="${p.key}">
      <span class="icon">${p.icon}</span><span class="title">${p.title}</span>
      ${p.hidden ? '<span class="hidden-tag">versteckt</span>' : ''}
    </div>`
  ).join('');
  wrap.innerHTML = html;
}

document.getElementById('filter').addEventListener('input', (e) => renderList(e.target.value));
document.getElementById('list').addEventListener('click', (e) => {
  const item = e.target.closest('.list-item');
  if (item) openEditor(item.dataset.key);
});

function statusMsg(el, type, txt) {
  el.className = 'status-msg ' + type;
  el.textContent = txt;
  if (type === 'ok') setTimeout(() => { el.className = 'status-msg'; el.textContent = ''; }, 3000);
}

async function openEditor(key) {
  currentKey = key;
  renderList(document.getElementById('filter').value);
  const card = document.getElementById('editor-card');
  card.innerHTML = '<p class="empty">Lade …</p>';
  const r = await fetch('/api/admin/prompts/' + encodeURIComponent(key), { headers: H });
  if (!r.ok) { card.innerHTML = '<p class="empty">Konnte nicht geladen werden.</p>'; return; }
  const data = await r.json();

  if (key === '_base') {
    card.innerHTML = `
      <h2>⚙️ Basis-Prompt</h2>
      <p class="note" style="margin-bottom:14px">Wird jedem Werkzeug-Prompt automatisch vorangestellt (Grundhaltung, Verhalten, Format-Regeln).</p>
      <div class="field">
        <label>System-Prompt</label>
        <textarea class="mono" id="f-body" rows="16">${esc(data.body)}</textarea>
      </div>
      <div class="save-bar">
        <button class="btn btn-primary" id="save-btn">Speichern</button>
        <span class="status-msg" id="status"></span>
      </div>`;
  } else {
    const m = data.meta || {};
    const examples = m.examples ? m.examples.split('|').map(s => s.trim()).filter(Boolean) : [];
    card.innerHTML = `
      <h2>${m.icon || '💬'} ${esc(m.title || key)}</h2>
      <div class="field field-row">
        <div><label>Icon</label><input type="text" id="f-icon" value="${esc(m.icon || '')}"></div>
        <div><label>Titel</label><input type="text" id="f-title" value="${esc(m.title || '')}"></div>
        <div><label>Reihenfolge <span class="hint-txt">order</span></label><input type="number" id="f-order" step="0.1" value="${esc(m.order ?? '')}"></div>
      </div>
      <div class="field">
        <label>Beschreibung <span class="hint-txt">im Menü unter dem Titel</span></label>
        <input type="text" id="f-desc" value="${esc(m.desc || '')}">
      </div>
      <div class="field">
        <label>Begrüßungstext <span class="hint-txt">welcome</span></label>
        <input type="text" id="f-welcome" value="${esc(m.welcome || '')}">
      </div>
      <div class="field">
        <label>Hinweistext <span class="hint-txt">hint, darf HTML enthalten</span></label>
        <input type="text" id="f-hint" value="${esc(m.hint || '')}">
      </div>
      <div class="field">
        <label>Wissensbereich <span class="hint-txt">workspace, nur bei RAG-Werkzeugen, leer lassen sonst</span></label>
        <input type="text" id="f-workspace" value="${esc(m.workspace || '')}">
      </div>
      <div class="field">
        <label>Beispiele <span class="hint-txt">ein Vorschlag pro Zeile</span></label>
        <textarea id="f-examples" rows="4">${esc(examples.join('\n'))}</textarea>
      </div>
      <div class="flags">
        ${flagCheckbox('websearch', 'Web-Suche', m.websearch === 'true')}
        ${flagCheckbox('multifile', 'Mehrere Dateien', m.multifile === 'true')}
        ${flagCheckbox('paperless', 'Paperless-Suche', m.paperless === 'true')}
        ${flagCheckbox('imagegen', 'Bildgenerierung', m.imagegen === 'true')}
        ${flagCheckbox('qrgen', 'QR-Code', m.qrgen === 'true')}
        ${flagCheckbox('hidden', 'Versteckt (nicht im Menü)', m.hidden === 'true')}
      </div>
      <div class="field">
        <label>System-Prompt <span class="hint-txt">Anweisung an das Modell (Deutsch)</span></label>
        <textarea class="mono" id="f-body" rows="14">${esc(data.body)}</textarea>
      </div>
      <p class="note">Übersetzungen (EN/FR/ES/RU/ID/MG) werden hier nicht angezeigt, aber beim Speichern automatisch per KI aus diesen deutschen Feldern aktualisiert.</p>
      <div class="save-bar">
        <button class="btn btn-primary" id="save-btn">Speichern</button>
        <span class="status-msg" id="status"></span>
      </div>`;
  }

  document.getElementById('save-btn').addEventListener('click', () => saveCurrent(key));
}

function flagCheckbox(field, label, checked) {
  return `<label class="flag"><input type="checkbox" id="f-${field}" ${checked ? 'checked' : ''}> ${label}</label>`;
}

function esc(s) {
  return String(s ?? '').replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
}
function oneLine(v) { return String(v ?? '').replace(/[\r\n]+/g, ' ').trim(); }

async function saveCurrent(key) {
  const btn = document.getElementById('save-btn');
  const status = document.getElementById('status');
  btn.disabled = true;
  status.className = 'status-msg';
  status.textContent = key === '_base' ? 'Speichere …' : 'Speichere & übersetze …';
  const payload = { body: document.getElementById('f-body').value };

  if (key !== '_base') {
    payload.meta = {
      icon: oneLine(document.getElementById('f-icon').value),
      title: oneLine(document.getElementById('f-title').value),
      desc: oneLine(document.getElementById('f-desc').value),
      welcome: oneLine(document.getElementById('f-welcome').value),
      hint: oneLine(document.getElementById('f-hint').value),
      workspace: oneLine(document.getElementById('f-workspace').value),
      order: document.getElementById('f-order').value,
      examples: document.getElementById('f-examples').value.split('\n').map(s => s.trim()).filter(Boolean),
      websearch: document.getElementById('f-websearch').checked,
      multifile: document.getElementById('f-multifile').checked,
      paperless: document.getElementById('f-paperless').checked,
      imagegen: document.getElementById('f-imagegen').checked,
      qrgen: document.getElementById('f-qrgen').checked,
      hidden: document.getElementById('f-hidden').checked,
    };
  }

  try {
    const r = await fetch('/api/admin/prompts/' + encodeURIComponent(key), { method: 'PUT', headers: H, body: JSON.stringify(payload) });
    const d = await r.json().catch(() => ({}));
    if (r.ok) {
      statusMsg(status, 'ok', '✓ gespeichert');
      await loadList();
    } else {
      statusMsg(status, 'err', '✗ ' + (d.error || 'Fehler'));
    }
  } catch (e) {
    statusMsg(status, 'err', '✗ Verbindungsfehler');
  }
  btn.disabled = false;
}

async function loadList() {
  const r = await fetch('/api/admin/prompts', { headers: H });
  if (!r.ok) { document.getElementById('list').innerHTML = '<p class="empty">Konnte nicht geladen werden.</p>'; return; }
  const d = await r.json();
  PROMPTS = d.prompts;
  HAS_BASE = d.hasBase;
  renderList(document.getElementById('filter').value);
}

(async () => {
  if (!(await ensureAdmin())) return;
  await loadList();
})();
</script>
</body>
</html>
