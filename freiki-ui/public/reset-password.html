<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{{APP_NAME}} – Neues Passwort</title>
  <link rel="icon" type="image/png" href="/app-icon-192.png">
  <style>
    *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
    body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif;background:#f1f5f9;min-height:100vh;padding:24px;color:#1f2937;display:flex;align-items:center;justify-content:center}
    .card{background:#fff;border-radius:16px;box-shadow:0 4px 24px rgba(30,58,138,.10);padding:32px 36px;max-width:400px;width:100%}
    .header{display:flex;align-items:center;gap:14px;margin-bottom:18px}
    .header img{width:44px;height:44px;border-radius:10px}
    .header h1{font-size:19px;font-weight:700;color:#1E3A8A}
    .intro{font-size:13px;color:#6b7280;line-height:1.6;margin-bottom:22px}
    label{display:block;font-size:12px;font-weight:600;color:#374151;margin:14px 0 5px}
    label:first-of-type{margin-top:0}
    input[type=password]{width:100%;padding:10px 12px;border:1px solid #d1d5db;border-radius:8px;font:inherit;font-size:14px;outline:none;background:#fff}
    input:focus{border-color:#2B9CD8}
    .hint{font-size:11px;color:#9ca3af;margin-top:4px}
    .btn{width:100%;margin-top:22px;padding:11px 16px;border:none;border-radius:8px;font:inherit;font-size:14px;font-weight:600;cursor:pointer;background:linear-gradient(135deg,#1E3A8A,#2B9CD8);color:#fff}
    .btn:hover{opacity:.9}
    .btn:disabled{opacity:.5;cursor:default}
    .status-msg{display:none;margin-top:16px;padding:12px 14px;border-radius:10px;font-size:13px;line-height:1.5}
    .status-msg.ok{display:block;background:#ecfdf5;border:1px solid #6ee7b7;color:#065f46}
    .status-msg.err{display:block;background:#fef2f2;border:1px solid #fca5a5;color:#991b1b}
    .back-link{display:block;text-align:center;margin-top:18px;font-size:12.5px;color:#2B9CD8;text-decoration:none}
    .back-link:hover{text-decoration:underline}
    .spinner{display:inline-block;width:14px;height:14px;border:2px solid rgba(255,255,255,.4);border-top-color:#fff;border-radius:50%;animation:spin .8s linear infinite;vertical-align:middle}
    @keyframes spin{to{transform:rotate(360deg)}}
  </style>
</head>
<body>
<div class="card">
  <div class="header">
    <img src="/app-icon-192.png" alt="">
    <h1>Neues Passwort vergeben</h1>
  </div>
  <div class="intro" id="rp-intro">Bitte ein neues Passwort für dein {{APP_NAME}}-Konto eingeben.</div>

  <form id="rp-form">
    <label for="rp-pw1">Neues Passwort</label>
    <input type="password" id="rp-pw1" autocomplete="new-password" required>
    <div class="hint">Mindestens 8 Zeichen.</div>

    <label for="rp-pw2">Passwort wiederholen</label>
    <input type="password" id="rp-pw2" autocomplete="new-password" required>

    <button type="submit" class="btn" id="rp-submit">Passwort setzen</button>
  </form>

  <div class="status-msg" id="rp-status"></div>
  <a class="back-link" href="/">Zurück zur Anmeldung</a>
</div>

<script>
function statusMsg(type, txt) {
  const s = document.getElementById('rp-status');
  s.className = 'status-msg ' + type;
  s.textContent = txt;
}

const token = new URLSearchParams(location.search).get('token');
if (!token) {
  document.getElementById('rp-form').style.display = 'none';
  statusMsg('err', 'Dieser Link ist ungültig. Bitte fordere über „Passwort vergessen" einen neuen Link an.');
}

document.getElementById('rp-form').addEventListener('submit', async (e) => {
  e.preventDefault();
  const btn = document.getElementById('rp-submit');
  const pw1 = document.getElementById('rp-pw1').value;
  const pw2 = document.getElementById('rp-pw2').value;
  if (pw1.length < 8) { statusMsg('err', 'Das Passwort muss mindestens 8 Zeichen haben.'); return; }
  if (pw1 !== pw2) { statusMsg('err', 'Die Passwörter stimmen nicht überein.'); return; }
  btn.disabled = true;
  btn.innerHTML = '<span class="spinner"></span> Wird gespeichert …';
  try {
    const res = await fetch('/api/reset-password', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ token, newPassword: pw1 }),
    });
    const data = await res.json();
    if (!res.ok) throw new Error(data.error || 'Fehler');
    document.getElementById('rp-form').style.display = 'none';
    statusMsg('ok', 'Dein Passwort wurde geändert. Du kannst dich jetzt damit anmelden.');
  } catch (err) {
    statusMsg('err', err.message);
    btn.disabled = false;
    btn.textContent = 'Passwort setzen';
  }
});
</script>
</body>
</html>
