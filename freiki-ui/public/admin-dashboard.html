<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Nutzungsstatistik</title>
  <link rel="icon" type="image/png" href="/app-icon-192.png">
  <style>
    @font-face {
      font-family: 'Hanken Grotesk';
      font-style: normal;
      font-weight: 400 800;
      font-display: swap;
      src: url('/fonts/hanken-grotesk-latin-ext.woff2') format('woff2');
      unicode-range: U+0100-02BA, U+02BD-02C5, U+02C7-02CC, U+02CE-02D7, U+02DD-02FF, U+0304, U+0308, U+0329, U+1D00-1DBF, U+1E00-1E9F, U+1EF2-1EFF, U+2020, U+20A0-20AB, U+20AD-20C0, U+2113, U+2C60-2C7F, U+A720-A7FF;
    }
    @font-face {
      font-family: 'Hanken Grotesk';
      font-style: normal;
      font-weight: 400 800;
      font-display: swap;
      src: url('/fonts/hanken-grotesk-latin.woff2') format('woff2');
      unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD;
    }
    *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
    body{font-family:'Hanken Grotesk',sans-serif;background:#f1f5f9;min-height:100vh;padding:24px;color:#1f2937}
    .page{max-width:1100px;margin:0 auto}
    .card{background:#fff;border-radius:16px;box-shadow:0 4px 24px rgba(30,58,138,.10);padding:28px 32px;margin-bottom:22px}
    .header{display:flex;align-items:center;gap:14px;margin-bottom:8px;justify-content:space-between;flex-wrap:wrap}
    .header-left{display:flex;align-items:center;gap:14px}
    .header img{width:44px;height:44px;border-radius:10px}
    .header h1{font-size:20px;font-weight:700;color:#1E3A8A}
    .header p{font-size:13px;color:#6b7280}
    h2{font-size:15px;font-weight:700;color:#1E3A8A;margin-bottom:14px}
    .btn{padding:8px 16px;border:none;border-radius:8px;font:inherit;font-size:13px;font-weight:600;cursor:pointer;transition:opacity .15s,background .15s;display:inline-flex;align-items:center;gap:4px;text-decoration:none}
    .btn-primary{background:linear-gradient(135deg,#1E3A8A,#2B9CD8);color:#fff}
    .btn-primary:hover{opacity:.9}
    .btn-ghost{background:#eef2ff;color:#1E3A8A}
    .btn-ghost:hover{background:#e0e7ff}
    .btn:disabled{opacity:.5;cursor:default}
    .range-picker{display:flex;gap:6px}
    .report-buttons{display:flex;flex-wrap:wrap;gap:8px;justify-content:flex-start}
    .range-btn{padding:6px 12px;border:1px solid #d1d5db;border-radius:999px;background:#fff;font:inherit;font-size:12px;font-weight:600;color:#374151;cursor:pointer}
    .range-btn:hover{border-color:#2B9CD8}
    .range-btn.active{background:#1E3A8A;border-color:#1E3A8A;color:#fff}
    .cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:14px}
    .stat-card{background:#f8fafc;border:1px solid #e5e7eb;border-radius:12px;padding:14px 16px}
    .stat-card .val{font-size:24px;font-weight:800;color:#1E3A8A;line-height:1.2}
    .stat-card .lbl{font-size:12px;color:#6b7280;margin-top:2px}
    .chart{display:flex;align-items:flex-end;gap:3px;height:140px;margin-top:6px;overflow-x:auto;padding-bottom:2px}
    .bar-wrap{flex:1 0 6px;min-width:6px;display:flex;flex-direction:column;justify-content:flex-end;height:100%;cursor:default}
    .bar{background:linear-gradient(180deg,#2B9CD8,#1E3A8A);border-radius:3px 3px 0 0;min-height:2px;transition:opacity .1s}
    .bar-sunday{background:linear-gradient(180deg,#f87171,#b91c1c)}
    .bar-wrap:hover .bar{opacity:.75}
    .chart-labels{display:flex;gap:3px;font-size:11px;color:#9ca3af;margin-top:6px}
    .chart-labels span{flex:1 0 6px;min-width:6px;text-align:center;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
    .tool-list{display:flex;flex-direction:column;gap:8px;margin-top:6px}
    .tool-row{display:flex;align-items:center;gap:10px;font-size:13px}
    .tool-row .name{width:170px;flex-shrink:0;color:#374151;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
    .tool-row .track{flex:1;background:#f1f5f9;border-radius:99px;height:10px;overflow:hidden}
    .tool-row .fill{display:block;height:100%;background:linear-gradient(90deg,#2B9CD8,#1E3A8A);border-radius:99px}
    .tool-row .count{width:36px;text-align:right;color:#6b7280;font-size:12px}
    .u-filter{width:100%;max-width:340px;margin-bottom:14px;padding:9px 11px;border:1px solid #d1d5db;border-radius:8px;font:inherit;font-size:14px;outline:none}
    .u-filter:focus{border-color:#2B9CD8}
    table{width:100%;border-collapse:collapse}
    th,td{text-align:left;padding:9px 10px;border-bottom:1px solid #f1f5f9;font-size:13px;vertical-align:middle}
    th{font-size:11px;text-transform:uppercase;letter-spacing:.03em;color:#9ca3af;font-weight:700;white-space:nowrap}
    td.num{text-align:right;font-variant-numeric:tabular-nums}
    tr.total-row td{font-weight:700;background:#eef2ff;color:#1E3A8A}
    #table-wrap{overflow-x:auto}
    .empty{color:#9ca3af;font-size:13px;padding:8px 0}
    .status-msg{font-size:13px;margin-left:10px}
    .status-msg.ok{color:#047857}
    .status-msg.err{color:#b91c1c}
    .back-link{display:inline-block;margin-top:4px;color:#6b7280;font-size:13px;text-decoration:none;cursor:pointer}
    .back-link:hover{color:#1E3A8A}
  </style>
</head>
<body>
<script>if (window.self !== window.top) document.documentElement.classList.add('embedded');</script>
<div class="page">
  <div class="card">
    <div class="header">
      <div class="header-left">
        <img src="/app-icon-192.png" alt="">
        <div>
          <h1>Nutzungsstatistik</h1>
          <p>Wer nutzt welches Werkzeug wie oft · nur für Administratoren</p>
        </div>
      </div>
      <div style="display:flex;flex-direction:column;gap:8px;align-items:flex-end">
        <div class="report-buttons" id="admin-nav-buttons">
          <button class="btn btn-ghost" onclick="window.parent.openToolPanel ? window.parent.openToolPanel('/users.html') : (window.top.location.href='/users.html')">👥 Benutzerverwaltung</button>
          <button class="btn btn-ghost" onclick="window.parent.openToolPanel ? window.parent.openToolPanel('/admin/config') : (window.top.location.href='/admin/config')">⚙️ Konfiguration</button>
          <button class="btn btn-ghost" onclick="window.parent.openToolPanel ? window.parent.openToolPanel('/admin-prompts.html') : (window.top.location.href='/admin-prompts.html')">📝 Prompts verwalten</button>
          <button class="btn btn-ghost" onclick="window.parent.openToolPanel ? window.parent.openToolPanel('/admin-pptx-templates.html') : (window.top.location.href='/admin-pptx-templates.html')">📊 PPT-Vorlagen verwalten</button>
        </div>
        <div class="report-buttons" id="report-buttons">
          <a class="btn btn-ghost" href="/api/admin/daily-report-preview" target="_blank" rel="noopener">👁️ Tagesbericht-Vorschau</a>
          <button class="btn btn-ghost" id="send-report-btn" data-url="/api/admin/trigger-daily-report" data-label="Tagesbericht">📧 Tagesbericht jetzt per Mail senden</button>
          <button class="btn btn-ghost" id="send-egress-btn" data-url="/api/admin/trigger-egress-report" data-label="Datenabfluss-Bericht" style="display:none">🔒 Datenabfluss-Bericht senden</button>
          <button class="btn btn-ghost" id="send-gpu-btn" data-url="/api/admin/jobs/gpuMetricsReport/run" data-label="GPU/LLM-Statistik">📊 GPU/LLM-Statistik senden</button>
        </div>
      </div>
    </div>
    <div style="display:flex;justify-content:flex-end;margin-top:8px"><span class="status-msg" id="report-status"></span></div>
  </div>

  <div class="card" id="services-card" style="display:none">
    <h2>Services &amp; Monitoring</h2>
    <div class="report-buttons" id="service-links"></div>
  </div>

  <div class="card">
    <div class="header">
      <h2 style="margin:0">Übersicht</h2>
      <div class="range-picker" id="range-picker">
        <button class="range-btn" data-days="7">7 Tage</button>
        <button class="range-btn" data-days="30">30 Tage</button>
        <button class="range-btn" data-days="90">90 Tage</button>
        <button class="range-btn" data-days="365">365 Tage</button>
      </div>
    </div>
    <div class="cards" id="cards"></div>
  </div>

  <div class="card">
    <h2>Verlauf</h2>
    <div class="chart" id="chart"></div>
    <div class="chart-labels" id="chart-labels"></div>
  </div>

  <div class="card">
    <h2>Meistgenutzte Werkzeuge</h2>
    <div class="tool-list" id="tool-list"></div>
  </div>

  <div class="card">
    <h2>Benutzer &amp; Werkzeug</h2>
    <input type="text" id="u-filter" class="u-filter" placeholder="Nutzer suchen …">
    <div id="table-wrap"><p class="empty">Lade …</p></div>
  </div>

  <a class="back-link" onclick="if(window.parent && window.parent.closeToolPanel){window.parent.closeToolPanel();}else{window.top.location.href='/';}">← Zurück zum Chat</a>
</div>

<script>
function bail(){ (window.top||window).location.href='/'; }
// Session-Cookie ist HttpOnly, daher /api/me als Server-Rundruf statt lokalem Token/Rolle.
async function ensureAdmin() {
  try {
    const r = await fetch('/api/me', { cache: 'no-store' });
    if (!r.ok) throw 0;
    const me = await r.json();
    if (me.role !== 'admin') throw 0;
    return true;
  } catch { bail(); return false; }
}

let currentDays = 30;
let currentByUser = [];
let currentByTool = [];

function fmtDate(iso) {
  if (!iso) return '–';
  return new Date(iso).toLocaleDateString('de-DE', { day: '2-digit', month: '2-digit', year: 'numeric' });
}

function renderCards(data, live) {
  const cards = [
    { val: data.totals.requests, lbl: `Anfragen (${data.days} Tage)` },
    { val: data.totals.users, lbl: `Aktive Nutzer (${data.days} Tage)` },
    { val: data.totals.withFile, lbl: 'Davon mit Datei-Upload' },
    { val: data.allTime.requests, lbl: `Anfragen gesamt (seit ${fmtDate(data.allTime.since)})` },
  ];
  if (live) {
    cards.push({ val: live.requests, lbl: 'Anfragen heute' });
    cards.push({ val: `${live.gpuCacheLive.toFixed(1)}%`, lbl: `GPU-Cache (Peak ${live.gpuCachePeak.toFixed(1)}%)` });
    if (live.powerLive != null) {
      cards.push({ val: `${live.powerLive} W`, lbl: `GPU-Leistung (Peak ${live.powerPeak} W)` });
    }
  }
  document.getElementById('cards').innerHTML = cards.map(c =>
    `<div class="stat-card"><div class="val">${c.val}</div><div class="lbl">${c.lbl}</div></div>`
  ).join('');
}

const WEEKDAYS = ['So', 'Mo', 'Di', 'Mi', 'Do', 'Fr', 'Sa'];
// UTC statt lokaler Zeitzone: date ist ein reiner "YYYY-MM-DD"-Tagesstempel ohne Uhrzeit,
// new Date(dateStr) parst das als UTC-Mitternacht - getDay() (lokal) könnte den Wochentag
// dadurch je nach Zeitzone um einen Tag verschieben, getUTCDay() nicht.
function weekday(dateStr) {
  const [y, m, d] = dateStr.split('-').map(Number);
  return WEEKDAYS[new Date(Date.UTC(y, m - 1, d)).getUTCDay()];
}

function renderChart(daily) {
  const max = Math.max(1, ...daily.map(d => d.count));
  const chartEl = document.getElementById('chart');
  chartEl.innerHTML = daily.map(d =>
    `<div class="bar-wrap" title="${weekday(d.date)}, ${d.date}: ${d.count} Anfrage${d.count === 1 ? '' : 'n'}">
      <div class="bar${weekday(d.date) === 'So' ? ' bar-sunday' : ''}" style="height:${Math.round((d.count / max) * 100)}%"></div>
    </div>`
  ).join('');
  // Balken sind chronologisch (älteste links, heute rechts) - bei Zeiträumen, die die
  // Kartenbreite sprengen (90/365 Tage), sonst müsste man erst manuell zu "heute" scrollen.
  chartEl.scrollLeft = chartEl.scrollWidth;
  const labels = document.getElementById('chart-labels');
  if (!daily.length) { labels.innerHTML = ''; return; }
  if (daily.length <= 10) {
    // Kurzer Zeitraum (7-Tage-Ansicht): Wochentagskürzel passen noch unter jeden Balken.
    labels.style.justifyContent = '';
    labels.innerHTML = daily.map(d => `<span>${weekday(d.date)}</span>`).join('');
  } else {
    // Langer Zeitraum: Text unter jedem Balken passt bei Hunderten Balken nicht mehr (auch
    // nicht als einzelnes "S") - Sonntage sind stattdessen rot eingefärbt (siehe .bar-sunday
    // oben), hier nur noch Datum an den beiden Enden, exaktes Datum sonst per Hover (title).
    labels.style.justifyContent = 'space-between';
    const first = daily[0].date.slice(5).split('-').reverse().join('.');
    const last = daily[daily.length - 1].date.slice(5).split('-').reverse().join('.');
    labels.innerHTML = `<span style="flex:none">${first}</span><span style="flex:none">${last}</span>`;
  }
}

function renderToolList(byTool) {
  if (!byTool.length) { document.getElementById('tool-list').innerHTML = '<p class="empty">Keine Nutzungsdaten im gewählten Zeitraum.</p>'; return; }
  const max = byTool[0].count;
  document.getElementById('tool-list').innerHTML = byTool.slice(0, 12).map(t =>
    `<div class="tool-row">
      <span class="name" title="${t.title}">${t.title}</span>
      <span class="track"><span class="fill" style="width:${Math.round((t.count / max) * 100)}%"></span></span>
      <span class="count">${t.count}</span>
    </div>`
  ).join('');
}

let tableSortKey = null, tableSortDir = 1;
function sortTableRows(rows) {
  if (!tableSortKey) return rows;
  const value = u => tableSortKey === 'user' ? u.user.toLowerCase()
    : tableSortKey === 'total' ? u.total
    : (u.byTool[tableSortKey] || 0);
  return rows.slice().sort((a, b) => {
    const va = value(a), vb = value(b);
    if (va < vb) return -1 * tableSortDir;
    if (va > vb) return 1 * tableSortDir;
    return 0;
  });
}

function renderTable(byUser, filter) {
  const wrap = document.getElementById('table-wrap');
  const f = (filter || '').trim().toLowerCase();
  const rows = sortTableRows(byUser.filter(u => !f || u.user.toLowerCase().includes(f)));
  if (!rows.length) { wrap.innerHTML = '<p class="empty">Keine Treffer.</p>'; return; }
  const tools = [...new Set(byUser.flatMap(u => Object.keys(u.byTool)))].sort();
  const arrow = key => tableSortKey === key ? (tableSortDir === 1 ? ' ▲' : ' ▼') : '';
  const sortableTh = (label, key) => `<th data-sort="${key}" style="cursor:pointer;user-select:none;">${label}${arrow(key)}</th>`;
  const th = tools.map(t => sortableTh(t, t)).join('');
  const trs = rows.map(u => {
    const cells = tools.map(t => `<td class="num">${u.byTool[t] ? u.byTool[t] : '–'}</td>`).join('');
    return `<tr><td>${u.user}</td>${cells}<td class="num"><strong>${u.total}</strong></td></tr>`;
  }).join('');
  const sumCells = tools.map(t => rows.reduce((s, u) => s + (u.byTool[t] || 0), 0)).map(v => `<td class="num">${v}</td>`).join('');
  const sumTotal = rows.reduce((s, u) => s + u.total, 0);
  wrap.innerHTML = `<table><thead><tr>${sortableTh('Benutzer', 'user')}${th}${sortableTh('Gesamt', 'total')}</tr></thead><tbody>${trs}
    <tr class="total-row"><td>Gesamt</td>${sumCells}<td class="num">${sumTotal}</td></tr>
  </tbody></table>`;
}

async function loadServiceLinks() {
  try {
    const r = await fetch('/api/admin/service-links');
    if (!r.ok) return;
    const { links } = await r.json();
    if (!links.length) return;
    document.getElementById('service-links').innerHTML = links.map(l =>
      `<a class="btn btn-ghost" href="${l.url}" target="_blank" rel="noopener">🔗 ${l.label} <span style="opacity:.7">– ${l.hint}</span></a>`
    ).join('');
    document.getElementById('services-card').style.display = '';
  } catch {}
}

async function loadDashboard(days) {
  currentDays = days;
  document.querySelectorAll('.range-btn').forEach(b => b.classList.toggle('active', parseInt(b.dataset.days, 10) === days));
  const [histRes, liveRes] = await Promise.all([
    fetch(`/api/admin/usage-history?days=${days}`),
    fetch('/api/admin/stats'),
  ]);
  if (!histRes.ok) { document.getElementById('table-wrap').innerHTML = '<p class="empty">Statistik konnte nicht geladen werden.</p>'; return; }
  const data = await histRes.json();
  const live = liveRes.ok ? await liveRes.json() : null;
  currentByUser = data.byUser;
  currentByTool = data.byTool;
  // Datenabfluss-Bericht existiert nur auf Instanzen mit eigenem Egress-Watch (aktuell nur
  // KorKI) - Button nur zeigen, wenn der Server das über /api/admin/stats bestätigt.
  document.getElementById('send-egress-btn').style.display = live?.hasEgress ? '' : 'none';
  renderCards(data, live);
  renderChart(data.daily);
  renderToolList(data.byTool);
  renderTable(currentByUser, document.getElementById('u-filter').value);
}

document.getElementById('range-picker').addEventListener('click', (e) => {
  const btn = e.target.closest('.range-btn');
  if (!btn) return;
  loadDashboard(parseInt(btn.dataset.days, 10));
});
document.getElementById('u-filter').addEventListener('input', (e) => renderTable(currentByUser, e.target.value));
document.getElementById('table-wrap').addEventListener('click', (e) => {
  const th = e.target.closest('th[data-sort]');
  if (!th) return;
  const key = th.dataset.sort;
  if (tableSortKey === key) tableSortDir *= -1; else { tableSortKey = key; tableSortDir = 1; }
  renderTable(currentByUser, document.getElementById('u-filter').value);
});

// Ein Handler für alle Berichts-Trigger-Buttons (Tagesbericht/GPU/Datenabfluss) statt
// dreifacher Kopie derselben Fetch-/Status-Logik - Unterschied ist nur URL+Label (data-Attribute).
document.getElementById('report-buttons').addEventListener('click', async (ev) => {
  const btn = ev.target.closest('button[data-url]');
  if (!btn) return;
  const status = document.getElementById('report-status');
  const label = btn.dataset.label;
  if (!confirm(`${label} jetzt auslösen?`)) return;
  btn.disabled = true;
  status.className = 'status-msg';
  status.textContent = 'Sende …';
  try {
    const r = await fetch(btn.dataset.url, { method: 'POST' });
    const d = await r.json().catch(() => ({}));
    status.className = 'status-msg ' + (r.ok ? 'ok' : 'err');
    status.textContent = r.ok ? `✓ ${label} gesendet` : `✗ ${label}: ${d.error || 'Fehler'}`;
  } catch (e) {
    status.className = 'status-msg err';
    status.textContent = `✗ ${label}: Verbindungsfehler`;
  }
  btn.disabled = false;
  setTimeout(() => { status.textContent = ''; status.className = 'status-msg'; }, 5000);
});

(async () => {
  if (!(await ensureAdmin())) return;
  loadServiceLinks();
  loadDashboard(currentDays);
})();
</script>
</body>
</html>
