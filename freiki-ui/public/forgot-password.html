<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{{APP_NAME}} – Passwort vergessen</title>
  <link rel="icon" type="image/png" href="/app-icon-192.png">
  <style>
    *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
    body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif;background:#f1f5f9;min-height:100vh;padding:24px;color:#1f2937;display:flex;align-items:center;justify-content:center}
    .card{background:#fff;border-radius:16px;box-shadow:0 4px 24px rgba(30,58,138,.10);padding:32px 36px;max-width:400px;width:100%}
    .header{display:flex;align-items:center;gap:14px;margin-bottom:18px}
    .header img{width:44px;height:44px;border-radius:10px}
    .header h1{font-size:19px;font-weight:700;color:#1E3A8A}
    .intro{font-size:13px;color:#6b7280;line-height:1.6;margin-bottom:22px}
    label{display:block;font-size:12px;font-weight:600;color:#374151;margin:14px 0 5px}
    label:first-of-type{margin-top:0}
    input[type=email]{width:100%;padding:10px 12px;border:1px solid #d1d5db;border-radius:8px;font:inherit;font-size:14px;outline:none;background:#fff}
    input:focus{border-color:#2B9CD8}
    .btn{width:100%;margin-top:22px;padding:11px 16px;border:none;border-radius:8px;font:inherit;font-size:14px;font-weight:600;cursor:pointer;background:linear-gradient(135deg,#1E3A8A,#2B9CD8);color:#fff}
    .btn:hover{opacity:.9}
    .btn:disabled{opacity:.5;cursor:default}
    .status-msg{display:none;margin-top:16px;padding:12px 14px;border-radius:10px;font-size:13px;line-height:1.5}
    .status-msg.ok{display:block;background:#ecfdf5;border:1px solid #6ee7b7;color:#065f46}
    .status-msg.err{display:block;background:#fef2f2;border:1px solid #fca5a5;color:#991b1b}
    .back-link{display:block;text-align:center;margin-top:18px;font-size:12.5px;color:#2B9CD8;text-decoration:none}
    .back-link:hover{text-decoration:underline}
    .spinner{display:inline-block;width:14px;height:14px;border:2px solid rgba(255,255,255,.4);border-top-color:#fff;border-radius:50%;animation:spin .8s linear infinite;vertical-align:middle}
    @keyframes spin{to{transform:rotate(360deg)}}
  </style>
</head>
<body>
<div class="card">
  <div class="header">
    <img src="/app-icon-192.png" alt="">
    <h1>Passwort vergessen</h1>
  </div>
  <div class="intro">Gib die bei {{APP_NAME}} hinterlegte E-Mail-Adresse ein. Falls ein Konto dazu existiert, senden wir dir einen Link zum Zurücksetzen des Passworts.</div>

  <form id="fp-form">
    <label for="fp-email">E-Mail</label>
    <input type="email" id="fp-email" autocomplete="email" required>

    <button type="submit" class="btn" id="fp-submit">Link anfordern</button>
  </form>

  <div class="status-msg" id="fp-status"></div>
  <a class="back-link" href="/">Zurück zur Anmeldung</a>
</div>

<script>
function statusMsg(type, txt) {
  const s = document.getElementById('fp-status');
  s.className = 'status-msg ' + type;
  s.textContent = txt;
}

document.getElementById('fp-form').addEventListener('submit', async (e) => {
  e.preventDefault();
  const btn = document.getElementById('fp-submit');
  const email = document.getElementById('fp-email').value.trim();
  btn.disabled = true;
  btn.innerHTML = '<span class="spinner"></span> Wird gesendet …';
  try {
    const res = await fetch('/api/forgot-password', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ email }),
    });
    const data = await res.json();
    if (!res.ok) throw new Error(data.error || 'Fehler');
    document.getElementById('fp-form').style.display = 'none';
    statusMsg('ok', 'Falls zu dieser E-Mail-Adresse ein Konto existiert, wurde soeben eine E-Mail mit einem Link zum Zurücksetzen des Passworts verschickt. Der Link ist eine Stunde gültig.');
  } catch (err) {
    statusMsg('err', err.message);
    btn.disabled = false;
    btn.textContent = 'Link anfordern';
  }
});
</script>
</body>
</html>
