openapi: 3.0.3
info:
  title: FreiKI / KorKI API
  description: |
    **FreiKI** ist ein lokal gehosteter, datenschutzfreundlicher KI-Assistent mit Dokumentenanalyse, RAG, Chat und Integrationen.
    Abgeleitete Instanzen (z. B. **KorKI**) nutzen dieselbe API-Oberfläche.

    ### Authentifizierung
    - **Session-Cookie** `freiki_session` (Browser) oder **JWT** (`Authorization: Bearer …`).
    - **Login**: `POST /api/login` setzt Cookie und liefert Token im Body; bei 2FA folgt `POST /api/login/verify-2fa`.
    - **Bot/Automation**: Header `X-API-Key` (= `BOT_API_KEY`) für `/api/bot-chat` und `/api/bot/sicherheitslage`.

    ### Basis-URL
    - **Lokal**: http://localhost:3000
    - **KorKI**: https://assi.diakonie-kork-ki.de
    - Swagger UI selbst nur über Tailscale (nicht öffentlich über Caddy).

    ### Features
    - **Chat**: KI-gestützte Konversationen mit verschiedenen Modi (z. B. Leichte Sprache, Zusammenfassen).
    - **Dokumentenanalyse**: PDF, DOCX, Bilder (OCR), Audio (Transkription).
    - **Wissensdatenbank (RAG)**: Semantische Suche in hinterlegten Dokumenten.
    - **Formulare**: Vorausgefüllte PDF-Formulare per Chat-Dialog (Vorlagen-Verwaltung + Ausfüll-Flow).
    - **Scanner**: QR-/Barcode-Scanner mit KI-gestützten Folgeaktionen und Produkt-Lookup.
    - **Barrierefreiheit**: Leichte Sprache mit Piktogramm-Illustration (ARASAAC).
    - **Excel-Analyse**: Dynamische Abfragen auf Excel-Dateien via MCP.
    - **Integration**: Mattermost, Paperless-ngx, SearXNG (Web-Suche), ARASAAC-Piktogramme.

  version: 1.2.0
  contact:
    name: FreiKI Support
  license:
    name: AGPL-3.0-or-later
    url: https://www.gnu.org/licenses/agpl-3.0.html

servers:
  - url: https://assi.diakonie-kork-ki.de
    description: KorKI (Diakonie Kork)
  - url: http://localhost:3000
    description: Lokale Entwicklungsumgebung
  - url: https://freiki.example.de
    description: Platzhalter eigene Instanz

tags:
  - name: Authentifizierung
    description: Login, Token-Verwaltung und Benutzerdaten
  - name: Chat
    description: KI-Chat, Modi und Historie
  - name: Dokumentenanalyse
    description: Upload, OCR, RAG und Wissensbereiche
  - name: Formulare
    description: Vorausgefüllte PDF-Formulare per Chat-Dialog (Vorlagen-Verwaltung und Ausfüll-Flow)
  - name: Scanner
    description: QR-/Barcode-Scanner mit KI-gestützten Folgeaktionen und Produkt-Lookup
  - name: Barrierefreiheit
    description: Leichte Sprache mit Piktogramm-Illustration (ARASAAC)
  - name: Excel
    description: Excel-Dateien analysieren und abfragen
  - name: Sprachfunktionen
    description: Transkription (Audio zu Text) und Text-to-Speech
  - name: Integration
    description: Paperless-ngx, Mattermost, SearXNG
  - name: Verwaltung
    description: Admin-Funktionen (Benutzer, Konfiguration, Statistiken)
  - name: System
    description: Health-Checks, Tips, Branding

paths:
  /api/login:
    post:
      tags:
        - Authentifizierung
      summary: Anmeldung
      description: |
        Meldet einen Benutzer an. Bei Erfolg (ohne aktive 2FA) wird das JWT als HttpOnly-Cookie
        (freiki_session) gesetzt UND im Response-Body zurückgegeben (siehe cookieAuth/bearerAuth).
        Ist für den Account 2FA aktiv, liefert die Antwort stattdessen requires2fa + pendingToken;
        der eigentliche Login schließt erst POST /api/login/verify-2fa ab.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - username
                - password
              properties:
                username:
                  type: string
                  example: max.mustermann
                password:
                  type: string
                  format: password
                  example: sicheresPasswort123!
      responses:
        "200":
          description: Erfolgreiche Anmeldung, oder 2FA-Code angefordert (requires2fa)
          headers:
            Set-Cookie:
              schema:
                type: string
                example: freiki_session=eyJhbG...; HttpOnly; SameSite=Lax; Path=/
              description: Nur gesetzt, wenn requires2fa fehlt (siehe Schema)
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: "#/components/schemas/LoginSuccess"
                  - $ref: "#/components/schemas/LoginRequires2fa"
        "401":
          description: Ungültige Anmeldedaten
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "429":
          description: Zu viele Login-Versuche (Rate-Limit 5 pro 15 Min)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /api/login/verify-2fa:
    post:
      tags:
        - Authentifizierung
      summary: 2FA-Code bestätigen (zweiter Login-Schritt)
      description: |
        Schließt den Login ab, wenn /api/login zuvor requires2fa gemeldet hat. Akzeptiert einen
        TOTP-Code oder einen Backup-Code. Setzt bei Erfolg dasselbe freiki_session-Cookie wie
        /api/login.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - pendingToken
                - code
              properties:
                pendingToken:
                  type: string
                  description: Aus der requires2fa-Antwort von /api/login (5 Min gültig)
                code:
                  type: string
                  example: "123456"
      responses:
        "200":
          description: Login abgeschlossen
          headers:
            Set-Cookie:
              schema:
                type: string
                example: freiki_session=eyJhbG...; HttpOnly; SameSite=Lax; Path=/
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LoginSuccess"
        "400":
          description: Code fehlt
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          description: Ungültiger Code oder abgelaufener pendingToken
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /api/webauthn/login/options:
    post:
      tags:
        - Authentifizierung
      summary: Passkey-Login-Optionen anfordern (zweiter Login-Schritt)
      description: |
        Alternative zum TOTP-Code im zweiten Login-Schritt bei aktivem 2FA - gleicher
        pendingToken wie /api/login/verify-2fa. Liefert WebAuthn-Challenge/Optionen für
        navigator.credentials.get(). Bewusst ohne Rate-Limit: eine WebAuthn-Antwort ist eine
        kryptografische Signatur, nicht erratbar wie ein Code.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - pendingToken
              properties:
                pendingToken:
                  type: string
                  description: Aus der requires2fa-Antwort von /api/login
      responses:
        "200":
          description: WebAuthn-Authentifizierungsoptionen (PublicKeyCredentialRequestOptions)
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
        "400":
          description: Ungültige Anfrage oder pendingToken abgelaufen
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /api/webauthn/login/verify:
    post:
      tags:
        - Authentifizierung
      summary: Passkey-Login bestätigen (zweiter Login-Schritt)
      description: Prüft die WebAuthn-Antwort gegen die zuvor per /api/webauthn/login/options erzeugte Challenge und schließt den Login ab. Setzt dasselbe freiki_session-Cookie wie /api/login/verify-2fa.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - pendingToken
                - response
              properties:
                pendingToken:
                  type: string
                response:
                  type: object
                  description: Vom Browser erzeugte AuthenticationResponseJSON (navigator.credentials.get())
                  additionalProperties: true
      responses:
        "200":
          description: Login abgeschlossen
          headers:
            Set-Cookie:
              schema:
                type: string
                example: freiki_session=eyJhbG...; HttpOnly; SameSite=Lax; Path=/
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LoginSuccess"
        "400":
          description: Ungültige Anfrage
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          description: Passkey-Anmeldung fehlgeschlagen
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /api/forgot-password:
    post:
      tags:
        - Authentifizierung
      summary: Passwort-Reset per E-Mail anfordern
      description: |
        Öffentliches Formular (public/forgot-password.html), ohne Session-Prüfung. Antwort ist
        absichtlich IMMER {ok:true} - unabhängig davon, ob die E-Mail existiert - damit sich
        darüber nicht erraten lässt, welche Adressen registriert sind. Existiert ein Konto,
        wird ein Einmal-Token (1h gültig, nur als SHA-256-Hash gespeichert) erzeugt und ein
        Reset-Link per Mail verschickt. Rate-limitiert (10/h).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - email
              properties:
                email:
                  type: string
                  format: email
                  example: max@example.com
      responses:
        "200":
          description: Immer {ok:true}, unabhängig davon ob die E-Mail existiert
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok:
                    type: boolean
                    example: true
        "400":
          description: Keine gültige E-Mail-Adresse übergeben
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "429":
          description: Zu viele Anfragen (Rate-Limit 10 pro Stunde)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /api/reset-password:
    post:
      tags:
        - Authentifizierung
      summary: Neues Passwort mit Reset-Token setzen
      description: Nimmt den per E-Mail verschickten Token entgegen (siehe /api/forgot-password) und setzt ein neues Passwort. Der Token ist nach Verwendung oder nach 1 Stunde ungültig.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - token
                - newPassword
              properties:
                token:
                  type: string
                newPassword:
                  type: string
                  format: password
                  minLength: 8
      responses:
        "200":
          description: Passwort erfolgreich geändert
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok:
                    type: boolean
                    example: true
        "400":
          description: Ungültiger/abgelaufener Link oder Passwort zu kurz
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "429":
          description: Zu viele Anfragen (Rate-Limit 10 pro Stunde)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /api/register:
    post:
      tags:
        - Authentifizierung
      summary: Selbstregistrierung (Zugang beantragen)
      description: |
        Öffentliches Anmeldeformular (public/register.html), nur aktiv wenn
        APP_SELF_REGISTRATION=true. Legt einen gesperrten Nutzer an (pending_approval); der
        Benutzername wird serverseitig aus Vor-/Nachname generiert, nicht abgefragt. Admins
        werden per Mail benachrichtigt und schalten über /api/admin/registrations frei.
        Rate-limitiert (5 pro Stunde).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - first_name
                - last_name
                - funktion
                - telefon
                - email
                - dienststelle
              properties:
                first_name:
                  type: string
                  example: Max
                last_name:
                  type: string
                  example: Mustermann
                funktion:
                  type: string
                  example: Sozialarbeiter
                telefon:
                  type: string
                  example: "0123 456789"
                email:
                  type: string
                  format: email
                dienststelle:
                  type: string
                  example: Wohnverbund Nord
                language:
                  type: string
                  description: Freitext, wird per LLM auf ein deutsches Sprach-Adjektiv normalisiert; leer/nicht erkannt fällt auf Deutsch zurück
                  example: englisch
      responses:
        "200":
          description: Registrierungsanfrage angelegt
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok:
                    type: boolean
                    example: true
                  username:
                    type: string
                    description: Serverseitig generierter Benutzername (noch gesperrt bis zur Freischaltung)
                    example: mmustermann
        "400":
          description: Pflichtfeld fehlt oder ungültige E-Mail-Adresse
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "429":
          description: Zu viele Registrierungsversuche (Rate-Limit 5 pro Stunde)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /api/logout:
    post:
      tags:
        - Authentifizierung
      summary: Abmelden
      description: Löscht das freiki_session-Cookie serverseitig.
      responses:
        "200":
          description: Abgemeldet
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok:
                    type: boolean
                    example: true

  /api/2fa/setup:
    post:
      tags:
        - Authentifizierung
      summary: 2FA-Einrichtung starten
      description: Erzeugt ein neues TOTP-Secret + QR-Code für den eingeloggten Nutzer.
      security:
        - cookieAuth: []
        - bearerAuth: []
      responses:
        "200":
          description: Secret + QR-Code zum Scannen
          content:
            application/json:
              schema:
                type: object
                properties:
                  secret:
                    type: string
                    example: JBSWY3DPEHPK3PXP
                  qrCode:
                    type: string
                    description: Data-URL (PNG) des QR-Codes
        "401":
          description: Nicht angemeldet
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /api/2fa/confirm:
    post:
      tags:
        - Authentifizierung
      summary: 2FA-Einrichtung bestätigen
      description: Schließt die 2FA-Einrichtung ab und liefert einmalig die Backup-Codes.
      security:
        - cookieAuth: []
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - code
              properties:
                code:
                  type: string
                  example: "123456"
      responses:
        "200":
          description: 2FA aktiviert
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok:
                    type: boolean
                    example: true
                  backupCodes:
                    type: array
                    items:
                      type: string
                    description: Nur in dieser Antwort sichtbar, danach nur noch als Hash gespeichert
        "400":
          description: Ungültiger Code oder kein Setup gestartet
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /api/2fa/reinit:
    post:
      tags:
        - Authentifizierung
      summary: 2FA neu einrichten (Selbstbedienung, z. B. bei Gerätewechsel)
      description: Erfordert das aktuelle Passwort zur Bestätigung, ersetzt danach die alten Backup-Codes.
      security:
        - cookieAuth: []
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - currentPassword
              properties:
                currentPassword:
                  type: string
                  format: password
      responses:
        "200":
          description: Neues Secret + QR-Code (wie /api/2fa/setup)
          content:
            application/json:
              schema:
                type: object
                properties:
                  secret:
                    type: string
                  qrCode:
                    type: string
        "401":
          description: Aktuelles Passwort falsch oder nicht angemeldet
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /api/webauthn/register/options:
    post:
      tags:
        - Authentifizierung
      summary: Passkey-Registrierung starten (Selbstverwaltung)
      description: Erzeugt WebAuthn-Registrierungsoptionen für den eingeloggten Nutzer (navigator.credentials.create()).
      security:
        - cookieAuth: []
        - bearerAuth: []
      responses:
        "200":
          description: WebAuthn-Registrierungsoptionen (PublicKeyCredentialCreationOptions)
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
        "400":
          description: Fehler beim Erzeugen der Optionen
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          description: Nicht angemeldet

  /api/webauthn/register/verify:
    post:
      tags:
        - Authentifizierung
      summary: Passkey-Registrierung bestätigen
      security:
        - cookieAuth: []
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - response
              properties:
                response:
                  type: object
                  description: Vom Browser erzeugte RegistrationResponseJSON
                  additionalProperties: true
                nickname:
                  type: string
                  description: Anzeigename für den Passkey (z. B. Gerätename), optional
                  example: MacBook Touch ID
      responses:
        "200":
          description: Passkey registriert
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
        "400":
          description: Ungültige Anfrage oder Verifikation fehlgeschlagen
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          description: Nicht angemeldet

  /api/webauthn/credentials:
    get:
      tags:
        - Authentifizierung
      summary: Eigene Passkeys auflisten
      security:
        - cookieAuth: []
        - bearerAuth: []
      responses:
        "200":
          description: Liste der registrierten Passkeys
          content:
            application/json:
              schema:
                type: object
                properties:
                  passkeys:
                    type: array
                    items:
                      type: object
                      properties:
                        id:
                          type: integer
                        nickname:
                          type: string
                          nullable: true
                        device_type:
                          type: string
                          nullable: true
                        created_at:
                          type: string
                          format: date-time
        "401":
          description: Nicht angemeldet

  /api/webauthn/credentials/{id}:
    delete:
      tags:
        - Authentifizierung
      summary: Eigenen Passkey löschen
      security:
        - cookieAuth: []
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Passkey gelöscht
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok:
                    type: boolean
                    example: true
        "401":
          description: Nicht angemeldet
        "404":
          description: Nicht gefunden (gehört nicht dem angemeldeten Nutzer)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /api/change-password:
    post:
      tags:
        - Authentifizierung
      summary: Passwort ändern
      security:
        - cookieAuth: []
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - currentPassword
                - newPassword
              properties:
                currentPassword:
                  type: string
                  format: password
                newPassword:
                  type: string
                  format: password
                  minLength: 8
      responses:
        "200":
          description: Passwort erfolgreich geändert
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
        "401":
          description: Aktuelles Passwort falsch
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /api/change-language:
    post:
      tags:
        - Authentifizierung
      summary: Antwortsprache ändern (Selbstbedienung)
      description: |
        Freitext-Eingabe (z. B. "italiano", "auf Englisch bitte") wird per LLM auf ein
        einzelnes deutsches Sprach-Adjektiv normalisiert und in freiki_users.language
        gespeichert. Nicht erkannte Eingaben liefern einen Fehler statt eines Fallbacks.
      security:
        - cookieAuth: []
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - language
              properties:
                language:
                  type: string
                  example: englisch
      responses:
        "200":
          description: Sprache geändert
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok:
                    type: boolean
                    example: true
                  language:
                    type: string
                    example: englisch
        "400":
          description: Sprache erforderlich oder nicht erkannt
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          description: Nicht angemeldet

  /api/change-enter-to-send:
    post:
      tags:
        - Authentifizierung
      summary: Enter-Sende-Verhalten ändern (Selbstbedienung)
      description: Steuert, ob Enter im Chat-Eingabefeld die Nachricht sofort sendet (true) oder nur einen Zeilenumbruch einfügt (false, dann sendet Shift+Enter bzw. der Senden-Button).
      security:
        - cookieAuth: []
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                enterToSend:
                  type: boolean
                  default: true
      responses:
        "200":
          description: Einstellung gespeichert
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok:
                    type: boolean
                    example: true
                  enterToSend:
                    type: boolean
        "401":
          description: Nicht angemeldet

  /api/training/complete:
    post:
      tags:
        - Authentifizierung
      summary: Pflichtschulung abschließen
      description: Markiert die Pflichtschulung als abgeschlossen (training_completed=true), nur relevant wenn APP_MANDATORY_TRAINING=true. Ein Admin kann dies über /api/admin/users/{id}/reset-training wieder zurücksetzen.
      security:
        - cookieAuth: []
        - bearerAuth: []
      responses:
        "200":
          description: Schulung als abgeschlossen markiert
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok:
                    type: boolean
                    example: true
        "401":
          description: Nicht angemeldet

  /api/training/decline:
    post:
      tags:
        - Authentifizierung
      summary: Pflichtschulung ablehnen (sperrt das eigene Konto)
      description: |
        Nutzer lehnt die Kenntnisnahme am Ende der Pflichtschulung ab -> Konto wird sofort
        gesperrt (training_completed bleibt false, damit die Schulung nach Admin-Entsperrung
        erneut angezeigt wird). Wird immer im Audit-Log protokolliert.
      security:
        - cookieAuth: []
        - bearerAuth: []
      responses:
        "200":
          description: Konto gesperrt
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok:
                    type: boolean
                    example: true
        "401":
          description: Nicht angemeldet

  /api/news/ack:
    post:
      tags:
        - Authentifizierung
      summary: Breaking-News-Hinweis quittieren
      description: Quittiert die aktuell aktive Breaking-News-Version für den eingeloggten Nutzer (news_ack_version). Die Version wird serverseitig aus der Brand-Config gelesen, nicht vom Client übergeben.
      security:
        - cookieAuth: []
        - bearerAuth: []
      responses:
        "200":
          description: Quittiert
          content:
