      tags:
        - Formulare
      summary: Formular-Dialog starten
      description: Legt eine neue Sitzung an (inkl. 8-stelliger PIN zum späteren Fortsetzen) und liefert die erste Frage.
      security:
        - cookieAuth: []
        - bearerAuth: []
      parameters:
        - name: slug
          in: path
          required: true
          schema:
            type: string
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                language:
                  type: string
                  description: Freitext, max. 40 Zeichen; Default Deutsch
                  example: Englisch
      responses:
        "200":
          description: Sitzung gestartet, erste Frage
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FormSessionState"
        "400":
          description: Formular hat noch keine Felder
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          description: Nicht angemeldet
        "404":
          description: Formular nicht gefunden oder nicht aktiv
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /api/forms/resume:
    post:
      tags:
        - Formulare
      summary: Pausierte Sitzung per PIN fortsetzen
      description: Rate-limitiert (10 Versuche/15 Min) gegen Brute-Force der 8-stelligen PIN.
      security:
        - cookieAuth: []
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - slug
                - pin
              properties:
                slug:
                  type: string
                pin:
                  type: string
                  example: "12345678"
      responses:
        "200":
          description: Aktueller Sitzungsstand
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FormSessionState"
        "400":
          description: Vorlage oder PIN fehlt
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          description: Nicht angemeldet
        "404":
          description: Formular oder Sitzung mit dieser PIN nicht gefunden
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "429":
          description: Zu viele Versuche (Rate-Limit 10 pro 15 Min)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /api/forms/{sessionId}/answer:
    post:
      tags:
        - Formulare
      summary: Antwort auf die aktuelle Formularfrage übergeben
      description: |
        Antworten werden bewusst NICHT durch ein LLM geprüft/normalisiert - reale Namen und
        Zahlen sind nicht zuverlässig algorithmisch validierbar. Bei Auswahlgruppen (mehrere
        exklusive Checkboxen) wird statt Freitext der field_key der gewählten Option gesendet.
      security:
        - cookieAuth: []
        - bearerAuth: []
      parameters:
        - name: sessionId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                message:
                  type: string
                  description: Freitext-Antwort, oder field_key bei Auswahlgruppen
                skip:
                  type: boolean
                  description: Frage überspringen (nur bei nicht-Pflichtfeldern erlaubt)
      responses:
        "200":
          description: Nächste Frage, oder done:true wenn alle Felder beantwortet sind
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FormSessionState"
        "400":
          description: Ungültige Sitzung, Pflichtfeld kann nicht übersprungen werden, ungültige Auswahl, oder keine Antwort übergeben
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          description: Nicht angemeldet
        "404":
          description: Sitzung nicht gefunden oder abgelaufen
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /api/forms/{sessionId}/finish:
    post:
      tags:
        - Formulare
      summary: Formular abschließen und als PDF herunterladen
      description: |
        Prüft, ob alle Pflichtfelder (gruppenweise, siehe Auswahlgruppen) beantwortet sind, und
        füllt die Vorlage zu einem PDF aus. Die Sitzung wird NICHT automatisch gelöscht - der
        Download kann fehlschlagen (z. B. Drucker), ohne dass die Sitzung verloren geht. Löschung
        erst nach expliziter Bestätigung über POST /api/forms/{sessionId}/confirm-print.
      security:
        - cookieAuth: []
        - bearerAuth: []
      parameters:
        - name: sessionId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Ausgefülltes PDF
          content:
            application/pdf:
              schema:
                type: string
                format: binary
        "400":
          description: Ungültige Sitzung oder noch nicht alle Pflichtfelder beantwortet
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          description: Nicht angemeldet
        "404":
          description: Sitzung nicht gefunden oder abgelaufen
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /api/forms/{sessionId}/confirm-print:
    post:
      tags:
        - Formulare
      summary: Ausdruck bestätigen (löscht die Sitzung)
      description: Nutzer bestätigt, dass der PDF-Ausdruck geklappt hat - erst dann wird die Sitzung gelöscht (Datenminimierung, aber erst nach erfolgreichem Ausdruck). Verwaiste Sitzungen fängt zusätzlich ein TTL-Purge-Job ab.
      security:
        - cookieAuth: []
        - bearerAuth: []
      parameters:
        - name: sessionId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Sitzung gelöscht
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok:
                    type: boolean
                    example: true
        "401":
          description: Nicht angemeldet
        "404":
          description: Sitzung nicht gefunden oder abgelaufen
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /api/form-templates:
    get:
      tags:
        - Formulare
      summary: Formularvorlagen verwalten - Liste
      description: Admin- und Manager-Zugriff (wie /api/kb-upload) - anders als die PPTX-Vorlagen dürfen Manager Formularvorlagen mitpflegen.
      security:
        - cookieAuth: []
        - bearerAuth: []
      responses:
        "200":
          description: Liste aller Vorlagen (auch inaktive)
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok:
                    type: boolean
                    example: true
                  templates:
                    type: array
                    items:
                      $ref: "#/components/schemas/FormTemplate"
        "403":
          description: Nur für Admins und Manager
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
    post:
      tags:
        - Formulare
      summary: Neue Formularvorlage anlegen (PDF/Bild-Scan hochladen)
      description: Rastert eine hochgeladene PDF-Vorlage seitenweise in PNGs (oder übernimmt ein einzelnes Bild), bevor im nächsten Schritt Felder per PUT /api/form-templates/{id}/fields eingezeichnet werden.
      security:
        - cookieAuth: []
        - bearerAuth: []
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required:
                - file
                - slug
                - title
              properties:
                file:
                  type: string
                  format: binary
                slug:
                  type: string
                  pattern: '^[a-z][a-z0-9-]{1,49}$'
                  example: antrag-eingliederungshilfe
                title:
                  type: string
                description:
                  type: string
      responses:
        "200":
          description: Vorlage angelegt, Seiten gerastert
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok:
                    type: boolean
                    example: true
                  template:
                    $ref: "#/components/schemas/FormTemplate"
                  pages:
                    type: array
                    items:
                      type: object
                      properties:
                        pageNumber:
                          type: integer
                        url:
                          type: string
        "400":
          description: Keine Datei, ungültiger Kurzname oder kein Titel
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "403":
          description: Nur für Admins und Manager
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "409":
          description: Kurzname bereits vergeben
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /api/form-templates/{id}:
    get:
      tags:
        - Formulare
      summary: Formularvorlage inkl. Seiten und Feldern laden (Editor)
      security:
        - cookieAuth: []
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Vorlage, Seiten und definierte Felder
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok:
                    type: boolean
                    example: true
                  template:
                    $ref: "#/components/schemas/FormTemplate"
                  pages:
                    type: array
                    items:
                      type: object
                      properties:
                        pageNumber:
                          type: integer
                        url:
                          type: string
                  fields:
                    type: array
                    items:
                      $ref: "#/components/schemas/FormField"
        "403":
          description: Nur für Admins und Manager
        "404":
          description: Vorlage nicht gefunden
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
    patch:
      tags:
        - Formulare
      summary: Stammdaten einer Formularvorlage ändern
      security:
        - cookieAuth: []
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                title:
                  type: string
                description:
                  type: string
                active:
                  type: boolean
                  description: Nur aktive Vorlagen erscheinen im Formular-Chat (GET /api/forms)
      responses:
        "200":
          description: Aktualisiert
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok:
                    type: boolean
                    example: true
                  template:
                    $ref: "#/components/schemas/FormTemplate"
        "403":
          description: Nur für Admins und Manager
        "404":
          description: Vorlage nicht gefunden
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
    delete:
      tags:
        - Formulare
      summary: Formularvorlage löschen
      description: Löscht die Vorlage inkl. aller Seitenbilder auf der Festplatte.
      security:
        - cookieAuth: []
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Gelöscht
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok:
                    type: boolean
                    example: true
        "403":
          description: Nur für Admins und Manager
        "404":
          description: Vorlage nicht gefunden
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /api/form-templates/{id}/pages/{pageNumber}/image:
    get:
      tags:
        - Formulare
      summary: Seitenbild einer Formularvorlage (Editor-Ansicht)
      security:
        - cookieAuth: []
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
        - name: pageNumber
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: PNG-Bild der Seite
          content:
            image/png:
              schema:
                type: string
                format: binary
        "403":
          description: Nur für Admins und Manager
        "404":
          description: Seite nicht gefunden
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /api/form-templates/{id}/fields:
    put:
      tags:
        - Formulare
      summary: Feld-Definitionen einer Formularvorlage speichern
      description: |
        Ersetzt die komplette Feldliste. Jedes Feld hat relative Koordinaten (0-1) auf einer
        Seite. Unterstützt Auswahlgruppen (mehrere exklusive Checkboxen, z. B. Familienstand -
        müssen im Array direkt aufeinanderfolgen) und bedingte Felder (depends_on_field_key,
        muss auf ein vorheriges Checkbox-Feld zeigen).
      security:
        - cookieAuth: []
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - fields
              properties:
                fields:
                  type: array
                  items:
                    $ref: "#/components/schemas/FormField"
      responses:
        "200":
          description: Gespeichert
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok:
                    type: boolean
                    example: true
                  fields:
                    type: array
                    items:
                      $ref: "#/components/schemas/FormField"
        "400":
          description: Ungültiges Feld (Name, Typ, Koordinate, Seitenzahl, Gruppe oder Abhängigkeit)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "403":
          description: Nur für Admins und Manager
        "404":
          description: Vorlage nicht gefunden
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /api/scanner/analyze:
    post:
      tags:
        - Scanner
      summary: Gescannten QR-/Barcode-Inhalt auf Folgeaktionen prüfen
      description: |
        Ordnet dem Inhalt per LLM mögliche Folgeaktionen zu (Link öffnen, Produkt-Lookup,
        Kontakt speichern, E-Mail, WLAN, Web-Suche). Reine Klassifikation - das Modell schlägt
        nur Buttons vor, die eigentliche Aktion übernimmt fest verdrahteter Code. Ein
        serverseitiges Vokabular filtert Halluzinationen hart heraus.
      security:
        - cookieAuth: []
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - text
              properties:
                text:
                  type: string
                  maxLength: 2000
                format:
                  type: string
                  description: Erkanntes Barcode-Format (z. B. QR_CODE, EAN_13, CODE_128)
                  maxLength: 40
      responses:
        "200":
          description: Vorgeschlagene Aktionen (max. 3, leer wenn keine passt)
          content:
            application/json:
              schema:
                type: object
                properties:
                  actions:
                    type: array
                    items:
                      type: object
                      properties:
                        type:
                          type: string
                          enum:
                            - open_url
                            - ean_lookup
                            - save_contact
                            - send_email
                            - wifi_info
                            - web_lookup
                        label:
                          type: string
                          nullable: true
        "400":
          description: Kein Text übergeben
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          description: Nicht angemeldet

  /api/barcode/product:
    get:
      tags:
        - Scanner
      summary: EAN/UPC-Produktsuche
      description: Über die öffentliche Open-Food-Facts-API (kein Key nötig) - deckt primär Lebensmittel/Konsumgüter ab.
      security:
        - cookieAuth: []
        - bearerAuth: []
      parameters:
        - name: code
          in: query
          required: true
          schema:
            type: string
            pattern: '^\d{6,14}$'
      responses:
        "200":
          description: Produktdaten, oder found:false wenn nicht gefunden
          content:
            application/json:
              schema:
                type: object
                properties:
                  found:
                    type: boolean
                  title:
                    type: string
                    nullable: true
                  brand:
                    type: string
                    nullable: true
                  quantity:
                    type: string
                    nullable: true
                  image:
                    type: string
                    nullable: true
                  allergens:
                    type: string
                    nullable: true
                    description: Deutsch übersetzte EU-Pflichtallergene, kommagetrennt
                  traces:
                    type: string
                    nullable: true
        "400":
          description: Ungültiger Code
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          description: Nicht angemeldet

  /api/barcode/manual:
    get:
      tags:
        - Scanner
      summary: Bedienungsanleitung zu einem Produkt suchen
      description: Websuche (SearXNG, dieselbe Infrastruktur wie der Chat-Modus "Web-Recherche") nach der Bedienungsanleitung eines per EAN gefundenen Produkts. Liefert nur Titel/URL fremder Websites.
      security:
        - cookieAuth: []
        - bearerAuth: []
      parameters:
        - name: title
          in: query
          required: true
          schema:
            type: string
            maxLength: 200
        - name: brand
          in: query
          required: false
          schema:
            type: string
            maxLength: 100
      responses:
        "200":
          description: Suchergebnisse (Titel + URL)
          content:
            application/json:
              schema:
                type: object
                properties:
                  results:
                    type: array
                    items:
                      type: object
                      properties:
                        title:
                          type: string
                        url:
                          type: string
        "400":
          description: Kein Produktname
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          description: Nicht angemeldet

  /api/barcode/websearch:
    get:
      tags:
        - Scanner
      summary: Generische Web-Suche zu einem Barcode ohne eigene Lookup-API
      description: Für Formate ohne freie Lookup-API (z. B. PZN/Pharmazentralnummer, ITF-Artikelnummern) - SearXNG-Suche mit formatabhängigem Hinweiswort zur besseren Trefferqualität.
      security:
        - cookieAuth: []
        - bearerAuth: []
      parameters:
        - name: code
          in: query
          required: true
          schema:
            type: string
            maxLength: 100
        - name: format
          in: query
          required: false
          schema:
            type: string
      responses:
        "200":
          description: Suchergebnisse (Titel + URL)
          content:
            application/json:
              schema:
                type: object
                properties:
                  results:
                    type: array
                    items:
                      type: object
                      properties:
                        title:
                          type: string
                        url:
                          type: string
        "400":
          description: Kein Code
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          description: Nicht angemeldet

  /api/leichte-sprache/symbols:
    post:
      tags:
        - Barrierefreiheit
      summary: Piktogramm-Kandidaten zu einer Leichte-Sprache-Antwort vorschlagen
      description: |
        Nimmt eine bereits fertige Leichte-Sprache-Antwort entgegen (ein Gedanke pro Zeile) und
        liefert pro Zeile mehrere ARASAAC-Piktogramm-Kandidaten statt einer automatischen
        Auswahl - der Nutzer wählt im "+ Symbole"-Wizard selbst aus.
      security:
        - cookieAuth: []
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - text
              properties:
                text:
                  type: string
                  description: Mehrzeiliger Leichte-Sprache-Text
      responses:
        "200":
          description: Piktogramm-Kandidaten je Zeile
          content:
            application/json:
              schema:
                type: object
                properties:
                  lines:
                    type: array
                    items:
                      type: object
                      properties:
                        text:
                          type: string
                        keyword:
                          type: string
                          nullable: true
                        candidates:
                          type: array
                          items:
                            type: object
                            properties:
                              id:
                                type: integer
                              keyword:
                                type: string
                              url:
                                type: string
                                description: data:-URL (base64-PNG)
        "400":
          description: Kein Text
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          description: Nicht angemeldet

  /api/leichte-sprache/symbols/pdf:
    post:
      tags:
        - Barrierefreiheit
      summary: Illustrierten Leichte-Sprache-Text als PDF exportieren
      description: Baut aus den im Wizard bestätigten Zeilen (Text + optionales Piktogramm) ein PDF, Icon links neben umgebrochenem Text.
      security:
        - cookieAuth: []
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - lines
              properties:
                lines:
                  type: array
                  items:
                    type: object
                    properties:
                      text:
                        type: string
                      imageDataUrl:
                        type: string
                        description: 'data:image/png;base64,... - optional'
      responses:
        "200":
          description: PDF-Datei
          content:
            application/pdf:
              schema:
                type: string
                format: binary
        "400":
          description: Keine Zeilen
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          description: Nicht angemeldet

  /api/leichte-sprache/symbols/word:
    post:
      tags:
        - Barrierefreiheit
      summary: Illustrierten Leichte-Sprache-Text als Word-Dokument exportieren
      description: Wie POST /api/leichte-sprache/symbols/pdf, nur als .docx.
      security:
        - cookieAuth: []
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - lines
              properties:
                lines:
                  type: array
                  items:
                    type: object
                    properties:
                      text:
                        type: string
                      imageDataUrl:
                        type: string
      responses:
        "200":
          description: Word-Dokument
          content:
            application/vnd.openxmlformats-officedocument.wordprocessingml.document:
              schema:
                type: string
                format: binary
        "400":
          description: Keine Zeilen
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          description: Nicht angemeldet

  /api/bot-chat:
    post:
      tags:
        - Integration
      summary: Mattermost-Bot-Chat
      description: |
        Wird von n8n/Mattermost aufgerufen. RAG über alle Wissensbereiche.
        Authentifizierung über Header `X-API-Key` (Env `BOT_API_KEY`).
      security:
        - botApiKey: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - message
              properties:
                message:
                  type: string
                  example: Was steht im SGB IX über Eingliederungshilfe?
                username:
                  type: string
                  description: Anzeigename des Mattermost-Nutzers (für Audit/n8n)
                  example: max.mustermann
      responses:
        "200":
          description: Antwort der KI
          content:
            application/json:
              schema:
                type: object
                properties:
                  answer:
                    type: string
                    example: Im SGB IX § 1 steht...
                  sources:
                    type: array
                    items:
                      type: string
        "400":
          description: Kein message übergeben
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "403":
          description: Ungültiger oder fehlender API-Key
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /api/bot/sicherheitslage:
    post:
      tags:
        - Integration
      summary: IT-Sicherheitslage speichern (n8n)
      description: |
        Speichert den von n8n erzeugten HTML-Digest als `sicherheitslage.json`.
        Authentifizierung über Header `X-API-Key` (Env `BOT_API_KEY`).
      security:
        - botApiKey: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - html
              properties:
                html:
                  type: string
                  description: Fertig gerenderter HTML-Block für das Frontend.
                date:
                  type: string
                  format: date
                  description: Optional, Default heutiges Datum (YYYY-MM-DD).
      responses:
        "200":
          description: Gespeichert
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok:
                    type: boolean
                    example: true
        "400":
          description: html fehlt
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "403":
          description: Ungültiger oder fehlender API-Key
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /api/mattermost/slash-command:
    post:
      tags:
        - Integration
      summary: Mattermost Slash-Command "/freiki"
      description: |
        Ersetzt den früheren n8n-Webhook-Workflow - Mattermosts commands.url zeigt direkt
        hierher. Mattermost verlangt eine Antwort binnen 3s, daher sofortige Bestätigung
        (ephemeral) + asynchrone Auslieferung der eigentlichen RAG-Antwort über response_url.
      security:
        - mattermostSlashToken: []
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              type: object
              required:
                - token
                - text
                - response_url
              properties:
                token:
                  type: string
                  description: Mattermost-Slash-Command-Token (MATTERMOST_SLASH_TOKEN)
                text:
                  type: string
                  example: Was steht im SGB IX über Eingliederungshilfe?
                user_name:
                  type: string
                response_url:
                  type: string
                  format: uri
                  description: Von Mattermost mitgeliefert, für die asynchrone Antwort
      responses:
        "200":
          description: Sofortige (ephemeral) Bestätigung, die eigentliche Antwort folgt per response_url
          content:
            application/json:
              schema:
                type: object
                properties:
                  response_type:
                    type: string
                    example: ephemeral
                  text:
                    type: string
        "403":
          description: Ungültiges Slash-Command-Token

  /api/mattermost/mention:
    post:
      tags:
        - Integration
      summary: Mattermost-Erwähnung "@freiki" in einem Channel
      description: |
        Ersetzt den früheren n8n-Workflow "FreiKI @mention Handler" - Mattermosts Outgoing-
        Webhook-Konfiguration zeigt direkt hierher. Antwort kommt nicht über die Webhook-
        Response, sondern per separatem REST-Aufruf mit dem Bot-Access-Token (MATTERMOST_BOT_TOKEN),
        da die RAG/LLM-Antwort zu lange für die synchrone Webhook-Antwort dauert.
      security:
        - mattermostMentionToken: []
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              type: object
              required:
                - token
                - channel_id
              properties:
                token:
                  type: string
                  description: Mattermost-Outgoing-Webhook-Token (MATTERMOST_MENTION_TOKEN)
                text:
                  type: string
                  example: "@freiki Was steht im SGB IX über Eingliederungshilfe?"
                user_name:
                  type: string
                channel_id:
                  type: string
      responses:
        "200":
          description: Sofort leer bestätigt (200, kein Body) - die eigentliche Antwort wird asynchron in den Channel gepostet
        "403":
          description: Ungültiges Token

  /api/hilfe-chat:
    post:
      tags:
        - Chat
      summary: Hilfe-Chat (App-eigene Dokumentation)
      description: |
        RAG-Antwort auf Basis der Hilfe-Wissensbasis (HILFE_KB_TABLE). Öffentlich, ohne Auth -
        beantwortet nur Fragen zur App selbst, nicht zu Kundendaten.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - message
              properties:
                message:
                  type: string
                  example: Wie lösche ich meinen Chatverlauf?
      responses:
        "200":
          description: Antwort der KI
          content:
            application/json:
              schema:
                type: object
                properties:
                  answer:
                    type: string
                    example: Der Chatverlauf liegt nur in Ihrem Browser und lässt sich über den Zurücksetzen-Button löschen.
        "400":
          description: Keine Nachricht übermittelt
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "503":
          description: Hilfe-Wissensbasis nicht konfiguriert (HILFE_KB_TABLE fehlt)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

